name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest tests -q
      - run: node --check web/app.js
      - run: node --check web/tasks.js
      - run: node --check web/workspace.js
      - run: python scripts/package_source.py
      - run: python scripts/release_check.py
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --strict --format json --output dependency-audit.json
      - run: python scripts/verify_docker.py --report docker-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-preview
          path: |
            release/*
            dependency-audit.json
            docker-verification.json
